<style>
:root{--amber:#ffb547;--cyan:#5ff2e6;--coral:#ff6b5a;--font:"Pretendard",-apple-system,system-ui,sans-serif;--hand:"Nanum Pen Script",cursive}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0b1a2e;font-family:var(--font);color:#fff;-webkit-font-smoothing:antialiased;word-break:keep-all}
body{height:1500vh}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#veil{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 40%,rgba(220,250,255,.9),rgba(95,200,230,.6));opacity:0}
.ui{position:fixed;pointer-events:none;transition:opacity .8s ease,transform .8s ease}

.shadow{text-shadow:0 2px 18px rgba(0,20,40,.5)}

#hint{left:50%;bottom:6vh;transform:translateX(-50%);text-align:center;font-size:15px;font-weight:600;pointer-events:auto;cursor:pointer}
#hint.hide{transform:translateX(-50%) translateY(10px)}

#readout .num small{font-size:.45em;margin-left:6px;opacity:.7}
#readout .zone{font-size:15px;font-weight:600;opacity:.8;margin-top:8px}

#intro{left:6vw;top:14vh;max-width:560px}

#card svg.frame rect{fill:none;stroke:var(--amber);stroke-width:1.5;stroke-dasharray:1600;stroke-dashoffset:1600;transition:stroke-dashoffset 1.4s ease .1s}
#card:not(.hide) svg.frame rect{stroke-dashoffset:0}

#card .eb{font-size:13px;font-weight:600;color:var(--amber)}
#card h3{font-size:30px;font-weight:700;letter-spacing:-.03em;margin-top:6px}
#card .role{font-size:14px;opacity:.7;margin-top:4px}

.lw{font-family:var(--hand);font-size:44px;fill:transparent;stroke:#3a2a12;stroke-width:1;stroke-dasharray:1400;stroke-dashoffset:1400}
#letter.show .lw{animation:write 2.2s ease forwards,fill2 .7s ease forwards}
#letter.show .l1{animation-delay:1s,3s}#letter.show .l2{animation-delay:2.4s,4.4s}#letter.show .l3{animation-delay:3.8s,5.8s}#letter.show .l4{animation-delay:5s,7s}
#letter .meta{opacity:0;transition:opacity .8s 6.6s}#letter.show .meta{opacity:1}
#letter button{display:block;margin:18px auto 0;font:600 16px var(--font);color:#05070b;background:#fff;border:0;border-radius:999px;padding:12px 26px;cursor:pointer;opacity:0;transition:opacity .6s 7s}
#letter.show button{opacity:1}
@keyframes unroll{to{transform:scaleY(1)}}
@keyframes fill2{to{fill:#3a2a12}}

#tip{position:fixed;pointer-events:none;background:rgba(5,12,24,.78);backdrop-filter:blur(8px);border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.4;opacity:0;transition:opacity .2s;white-space:nowrap}
#tip b{display:block;font-size:17px;color:var(--amber)}
#tip.show{opacity:1}

html.final .hw{stroke-dashoffset:0!important;fill:#fff!important;animation:none!important}
html.final .lw{stroke-dashoffset:0!important;fill:#3a2a12!important;animation:none!important}
html.final #letter .paper{transform:none!important;animation:none!important}

html.final #intro .facts{opacity:1;transition:none}
html.final .ui,html.final #card,html.final #letter,html.final #labels .lab,html.final #card svg.frame rect{transition:none!important}
html.bare .ui,html.bare #labels{display:none}
@media (max-width:700px){#meter{right:0;width:84px}#intro .facts p{font-size:14px}#card{right:5vw;top:auto;bottom:4vh;transform:none}}
@media (prefers-reduced-motion:reduce){#hint svg{animation:none}}
</style>

<script type="module">
import * as THREE from 'three';
import { Water } from 'three/addons/objects/Water.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const Q=new URLSearchParams(location.search);
if(Q.has('final'))document.documentElement.classList.add('final');
if(Q.has('bare'))document.documentElement.classList.add('bare');
history.scrollRestoration='manual';

const V3=THREE.Vector3, C=h=>new THREE.Color(h);
const lerp=(a,b,t)=>a+(b-a)*t, cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ss=(a,b,x)=>{x=cl((x-a)/(b-a));return x*x*(3-2*x)};
const rnd=(()=>{let s=11;return()=>(s=(s*16807)%2147483647)/2147483647})();
function hash(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return lerp(lerp(hash(xi,yi),hash(xi+1,yi),u),lerp(hash(xi,yi+1),hash(xi+1,yi+1),u),v);}
function fbm(x,y,o=5){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f);a*=.5;f*=2.03;}return s;}
function piece(x,st){if(x<=st[0][0])return st[0][1];for(let i=1;i<st.length;i++)if(x<=st[i][0])return lerp(st[i-1][1],st[i][1],(x-st[i-1][0])/(st[i][0]-st[i-1][0]));return st[st.length-1][1];}

/* ---------- 깊이 ↔ 스크롤 ↔ 3D 높이 ----------
   구역마다 스크롤 길이를 비슷하게, 깊을수록 3D 거리는 압축 */
const S_STOPS=[[0,0],[.03,6],[.24,200],[.48,1000],[.72,2500],[.86,4000],[1,4000]];
const sToM=s=>piece(s,S_STOPS), mToS=m=>piece(m,S_STOPS.slice(0,6).map(([a,b])=>[b,a]));
const mToY=m=>m<=200?-m*.35:m<=1000?-70-(m-200)*.06:-118-(m-1000)*.02;
const yToM=y=>-y<=70?-y/.35:-y<=118?200+(-y-70)/.06:1000+(-y-118)/.02;

/* =========================================================
   렌더러 · 후처리
   ========================================================= */
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance',preserveDrawingBuffer:[...Q.keys()].length>0});
renderer.setPixelRatio(Math.min(1.75,devicePixelRatio));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.42;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,20000);
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.3,.4,3.);composer.addPass(bloom);
composer.addPass(new OutputPass());
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

/* =========================================================
   하늘(대기 산란) · 환경맵
   ========================================================= */
const SUN=new V3(-.36,.04,-1).normalize();
const sky=new Sky();sky.scale.setScalar(10000);
const su=sky.material.uniforms;su.turbidity.value=12;su.rayleigh.value=4;su.mieCoefficient.value=.0025;su.mieDirectionalG.value=.78;su.sunPosition.value.copy(SUN);
const pmrem=new THREE.PMREMGenerator(renderer);
const envScene=new THREE.Scene();envScene.add(sky);
const ENV_SKY=pmrem.fromScene(envScene).texture;
scene.add(sky);
const uwScene=new THREE.Scene();
uwScene.add(new THREE.Mesh(new THREE.SphereGeometry(10,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,
  vertexShader:`varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vD;void main(){float h=vD.y;vec3 c=mix(vec3(.02,.12,.22),vec3(.25,.75,.95),smoothstep(-.2,.9,h));c+=vec3(.9,1.,1.)*pow(max(h,0.),8.)*1.5;gl_FragColor=vec4(c,1.);}`})));
const ENV_UW=pmrem.fromScene(uwScene).texture;
scene.environment=ENV_SKY;

const hemi=new THREE.HemisphereLight(0xffd3b0,0x2a4a66,.6);scene.add(hemi);
const sunL=new THREE.DirectionalLight(0xffb27a,3.2);
sunL.position.set(-14,9,-30);sunL.castShadow=true;sunL.shadow.mapSize.set(2048,2048);
Object.assign(sunL.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:80});sunL.shadow.bias=-.0004;sunL.shadow.normalBias=.03;
scene.add(sunL);sunL.target.position.set(-2,0,-5);scene.add(sunL.target);
const fill=new THREE.DirectionalLight(0x8fb8ff,.5);fill.position.set(8,6,12);scene.add(fill);
scene.fog=new THREE.FogExp2(0xe8a07e,.0016);

/* =========================================================
   커스틱 (MeshStandardMaterial 셰이더 주입)
   ========================================================= */
const CAU={uTime:{value:0},uCau:{value:0}};
const CAUSTIC_GLSL=`varying vec3 vCW;varying vec3 vCN;uniform float uTime,uCau;
float caus(vec2 uv){vec2 p=mod(uv*6.28318,6.28318)-250.;vec2 i=p;float c=1.,inten=.005,t=uTime*.45+23.;
  for(int n=0;n<4;n++){float tt=t*(1.-(3.5/float(n+1)));i=p+vec2(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x));
    c+=1./length(vec2(p.x/(sin(i.x+tt)/inten),p.y/(cos(i.y+tt)/inten)));}
  c/=4.;c=1.17-pow(c,1.4);return pow(abs(c),8.);}`;
function caustics(mat,key,extra){
  mat.onBeforeCompile=sh=>{
    sh.uniforms.uTime=CAU.uTime;sh.uniforms.uCau=CAU.uCau;
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vCW;varying vec3 vCN;')
      .replace('#include <project_vertex>','#include <project_vertex>\nvCW=(modelMatrix*vec4(transformed,1.)).xyz;vCN=normalize(mat3(modelMatrix)*objectNormal);');
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\n'+CAUSTIC_GLSL)
      .replace('#include <dithering_fragment>',`#include <dithering_fragment>
        if(vCW.y<.05){float cz=caus(vCW.xz*.32)+.6*caus(vCW.xz*.21+7.);
          gl_FragColor.rgb+=vec3(.55,.9,1.)*cz*uCau*exp(vCW.y*.03)*clamp(vCN.y*.8+.35,0.,1.);}`);
    if(extra)extra(sh);
  };
  mat.customProgramCacheKey=()=>'cau'+key;
  return mat;
}

/* =========================================================
   수면 (Water: 반사 · 굴절 · 햇빛 반짝임) + 물속에서 본 수면
   ========================================================= */
function waterNormals(){
  const N=256,h=new Float32Array(N*N),W=[];
  for(let i=0;i<46;i++){let kx=Math.round((rnd()-.5)*(i<16?10:40)),ky=Math.round((rnd()-.5)*(i<16?10:40));if(!kx&&!ky)kx=1;W.push([kx,ky,rnd()*6.283,1/Math.pow(Math.hypot(kx,ky),1.1)]);}
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){let s=0;for(const w of W)s+=w[3]*Math.sin(6.2832*(w[0]*x+w[1]*y)/N+w[2]);h[y*N+x]=s;}
  const cv=document.createElement('canvas');cv.width=cv.height=N;const cx=cv.getContext('2d'),img=cx.createImageData(N,N);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){

  else tip.classList.remove('show');

  hoverObj=null;
  if(mouseIn&&uw&&dNow>200)hoverObj=pick();
  document.body.style.cursor=hoverObj||hit>=0?'pointer':'';
  relicObjs.forEach(o=>{const u=o.userData,near=Math.abs(o.position.y-D.root.position.y)<9;o.visible=near;
    if(!near&&u.target){closeCard();}
    u.k+=(u.target-u.k)*(1-Math.exp(-dt*(Q.has('open')?60:3)));o.userData.anim(u.k,t);
    u.halo.intensity=near?(hoverObj===o?6:0)+u.k*14:0;});
  if(openRelic>=0&&Math.abs(relicObjs[openRelic].position.y-D.root.position.y)>6)closeCard();
  if(openRelic>=0)expr.happy=1;

  /* ---- 감정 생물 ---- */
  let litAny=false;
  creatObjs.forEach(g=>{const u=g.userData,near=Math.abs(u.y0-D.root.position.y)<8;g.visible=near;
    const lit=near?cl(1-(aimS.distanceTo(g.position)-1.2)/2.2)*lampK:0;u.k+=(lit-u.k)*(1-Math.exp(-dt*(Q.has('aim')?60:4)));g.userData.anim(u.k,t);
    if(u.k>.45){litAny=true;wp.copy(g.position).add(new V3(0,1.6,0)).project(camera);u.el.style.left=((wp.x+1)/2*innerWidth)+'px';u.el.style.top=((1-wp.y)/2*innerHeight)+'px';}
    u.el.classList.toggle('show',u.k>.45&&near&&!Q.has('bare'));});
  if(litAny){expr.sad=.8;expr.scared=.3;}

  /* ---- 해저 · 병 ---- */
  {const u=bottle.userData;u.k+=(u.target-u.k)*(1-Math.exp(-dt*(Q.has('letter')?60:2.5)));
   u.cork.position.y=1.13+u.k*.9;u.cork.rotation.z=u.k*4;u.paper.position.y=.35+u.k*.6;u.paper.material.emissiveIntensity=1.6+u.k*3+Math.sin(t*2)*.3;u.bl.intensity=6+u.k*10;
   bottle.visible=Math.abs(FLOOR_Y-D.root.position.y)<12;
   if(hoverObj===bottle)u.bl.intensity+=6;}
  stalks.forEach((s,i)=>s.material.emissiveIntensity=2.6+Math.sin(t*1.5+i)*1.2);

  setExpr(expr,dt);

  /* ---- 2D UI ---- */
  const dmr=phase==='island'?0:Math.round(dNow);
  $('dnum').textContent=dmr.toLocaleString();
  $('dzone').textContent=dmr<1?'수면':dmr<200?'빛이 드는 층':dmr<1000?'어스름 층':dmr<3990?'심해':'해저';
  $('mark').setAttribute('transform',`translate(0 ${phase==='island'?Y0:mToMeter(dNow)})`);
  const inIntro=phase!=='island'&&dNow>3.5&&dNow<48&&tSince>2&&!ascending;
  show('intro',inIntro);if(inIntro&&!introPlayed){introPlayed=true;$('intro').classList.add('play');}
  let zi=-1;ZONES.forEach((z,i)=>{if(dNow>=z.a&&dNow<z.b)zi=i;});if(ascending||letterOpen&&zi===3)zi=-1;setZone(zi);
  show('outro',ascended&&!ascending&&dNow<3);
  if(phase==='under'&&s<.002&&dNow<9&&!ascended)show('title',true);else if(phase!=='island')show('title',false);
  if(letterOpen&&dNow<3900&&!ascending){letterOpen=false;bottle.userData.target=0;$('letter').classList.remove('show');}

  composer.render();
});
window.__ready=true;
</script>
